services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/passiton
      REDIS_URL: redis://redis:6379
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-lpu.co.in,lpu.in}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GRADUATING_SOON_WINDOW_DAYS: ${GRADUATING_SOON_WINDOW_DAYS:-90}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-false}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@lpu.in}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-DemoPass123!}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
